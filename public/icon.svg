<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="note" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Floating Sticky Note Card -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="url(#note)" transform="rotate(-4 256 256)"/>
  
  <!-- Content lines on note -->
  <rect x="140" y="180" width="160" height="18" rx="9" fill="#78350f" opacity="0.7" transform="rotate(-4 256 256)"/>
  <rect x="140" y="225" width="230" height="14" rx="7" fill="#78350f" opacity="0.5" transform="rotate(-4 256 256)"/>
  <rect x="140" y="260" width="190" height="14" rx="7" fill="#78350f" opacity="0.5" transform="rotate(-4 256 256)"/>
  <rect x="140" y="295" width="140" height="14" rx="7" fill="#78350f" opacity="0.5" transform="rotate(-4 256 256)"/>

  <!-- Pin on top -->
  <circle cx="260" cy="115" r="28" fill="url(#pin)"/>
  <circle cx="260" cy="115" r="12" fill="#ffffff" opacity="0.8"/>
  <path d="M260 143 L260 175" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
</svg>
